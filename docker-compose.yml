version: "3.8"

services:
  hypebotx:
    build: .
    container_name: hypebotx
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production

      DATABASE_PROVIDER: json
      STORAGE_PROVIDER: json
      DATABASE_DIR: /app/storage
      BACKUP_DIR: /app/backups
      TEMP_DIR: /app/storage/temp
      TRANSCRIPT_DIR: /app/storage/transcripts

      CACHE_PROVIDER: memory
      REDIS_ENABLED: "false"
      REDIS_URL: ""
      BULL_ENABLED: "false"

      OWNER_DASHBOARD_HOST: 0.0.0.0
      OWNER_DASHBOARD_PORT: "8787"

    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./.env:/app/.env:ro

    ports:
      - "8787:8787"
      - "3000:3000"

    networks:
      - hypebotx-network

networks:
  hypebotx-network:
    driver: bridge
