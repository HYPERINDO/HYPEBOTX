version: '3.8'

services:
  hypebotx-staging:
    build: .
    container_name: hypebotx-staging
    restart: unless-stopped
    environment:
      - NODE_ENV=staging
      - CACHE_PROVIDER=redis
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis-staging:6379
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/app/storage/staging.db
      - LOG_LEVEL=debug
      - OWNER_DASHBOARD_PORT=8788
      - OWNER_DASHBOARD_HOST=0.0.0.0
      - STAGING_MODE=true
    volumes:
      - ./storage/staging:/app/storage
      - ./logs/staging:/app/logs
      - ./backups/staging:/app/backups
      - ./.env.staging:/app/.env:ro
    depends_on:
      - redis-staging
    networks:
      - hypebotx-staging-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8788/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis-staging:
    image: redis:7-alpine
    container_name: hypebotx-redis-staging
    restart: unless-stopped
    volumes:
      - redis_staging_data:/data
    networks:
      - hypebotx-staging-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_staging_data:

networks:
  hypebotx-staging-network:
    driver: bridge
