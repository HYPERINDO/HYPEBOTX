name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint bot
        run: npm run lint:bot

      - name: Test bot
        run: npm run test:bot

      - name: Lint dashboard backend
        run: npm run lint:backend

      - name: Test dashboard backend
        run: npm run test:backend

      - name: Lint dashboard frontend
        run: npm run lint:frontend

      - name: Test dashboard frontend
        run: npm run test:frontend

      - name: Build dashboard frontend
        run: npm run build:frontend

      - name: Build dashboard backend
        run: npm run build:backend

      - name: Audit dependencies
        run: npm audit --audit-level=high --workspaces
